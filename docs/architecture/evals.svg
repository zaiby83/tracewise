<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tracewise-evals-title tracewise-evals-desc" id="evals-root">
<title id="tracewise-evals-title">Tracewise nightly evaluations and alerts</title>
<desc id="tracewise-evals-desc">Each night EventBridge Scheduler starts a Step Functions workflow that samples traces from DynamoDB, grades them with a Bedrock judge, stores the run and publishes scores to CloudWatch, alerting through SNS on a regression; CloudWatch alarms on the ingest path alert through the same topic.</desc>
<defs>
      <style>#evals-root { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0b0b0b; }
      #evals-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#evals-root .diagram-container { overflow-x: visible; }
}</style>
