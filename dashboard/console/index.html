<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracewise console</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 20l5-6 4 4 6-8 3 3' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="console.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar">
	<div class="bar-inner">
		<a class="brand" href="#/" aria-label="Tracewise console home">
			<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M7 20l5-6 4 4 6-8 3 3"/></svg>
			<span>Tracewise</span>
		</a>
		<div class="bar-right">
			<label id="org-switch" class="org-switch" hidden>
				<span class="visually-hidden">Organization</span>
				<select id="org-select"></select>
			</label>
			<span id="who" class="who tenant" hidden></span>
			<button id="theme-button" class="icon-button" type="button" aria-label="Switch to dark theme" title="Toggle theme">
				<svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
				<svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
			</button>
			<button id="signout-button" class="button" type="button" hidden>Sign out</button>
		</div>
	</div>
</header>

<nav id="nav" class="console-nav" aria-label="Console" hidden>
	<div class="nav-inner" id="nav-links"></div>
</nav>

<div id="banners" class="banners" hidden></div>

<main id="view" aria-live="polite">
	<p class="empty">Loading…</p>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
</body>
</html>
